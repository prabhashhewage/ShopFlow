<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopFlow — Offline Supermarket POS</title>
<style>
@font-face{font-family:"Gotham";src:url("Gotham-Light.otf") format("opentype");font-weight:300;font-style:normal;font-display:swap;}
@font-face{font-family:"Gotham";src:url("Gotham-Book.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:"Gotham Black";src:url("Gotham-Black.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap;}

:root{color-scheme:light dark;--bg:light-dark(#f5f7fb,#0f1117);--surface:light-dark(#fff,#171a22);--surface2:light-dark(#f0f3f8,#20242e);--text:light-dark(#172033,#f4f6fb);--muted:light-dark(#667085,#a6adbd);--border:light-dark(#dfe4ec,#303643);--accent:#9d00d6;--accent2:#5f00b8;--danger:#d64545;--ok:#16845b;--warn:#b87800;--shadow:0 10px 30px rgba(20,30,55,.08)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Gotham",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--bg);display:flex}.sidebar{width:235px;border-right:1px solid var(--border);background:var(--surface);padding:20px 14px;position:fixed;inset:0 auto 0 0}.brand{display:flex;align-items:center;gap:11px;padding:8px 10px 24px;font-weight:400;font-size:12px}.logo{width:34px;height:34px;border-radius:10px;display:block;object-fit:cover}.nav{display:grid;gap:5px}.nav button{font-weight:400;border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:10px;align-items:center}.nav button.active,.nav button:hover{background:var(--surface2);color:var(--text)}.main{margin-left:235px;width:calc(100% - 235px);padding:24px 28px 40px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.title h1{font-weight:400;font-size:24px;margin:0 0 4px}.title p{font-weight:400;margin:0;color:var(--muted);font-size:12px}.user{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:400}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow)}.card{padding:17px}.card .label{font-weight:400;color:var(--muted);font-size:12px}.card .value{font-size:24px;font-weight:400;margin-top:7px}.card .delta{font-weight:400;font-size:12px;margin-top:7px}.ok{color:var(--ok)}.warn{color:var(--warn)}.danger{color:var(--danger)}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.panel{padding:18px}.panel h3{font-weight:400;margin:0 0 15px;font-size:12px}.bars{height:205px;display:flex;align-items:end;gap:12px;padding:12px 8px 0}.barwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:end}.bar{width:100%;max-width:38px;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:6px 6px 2px 2px;min-height:8px}.barwrap span{font-size:12px;color:var(--muted)}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.row small{color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.input{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 11px;border-radius:8px;outline:none}.input:focus{border-color:var(--accent)}.btn{font-weight:400;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 13px;border-radius:8px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:var(--muted);font-weight:400;border-bottom:1px solid var(--border);padding:10px}.table td{padding:11px 10px;border-bottom:1px solid var(--border)}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:12px;background:var(--surface2)}.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.danger{color:var(--danger)}.pos{display:grid;grid-template-columns:1.35fr .85fr;gap:16px}.search{display:flex;gap:8px;margin-bottom:12px}.search input{flex:1}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-height:530px;overflow:auto}.product{border:1px solid var(--border);background:var(--surface);padding:12px;border-radius:10px;text-align:left}.product:hover{border-color:var(--accent)}.product strong{font-weight:400;display:block;font-size:12px;margin-bottom:6px}.product span{font-size:12px;color:var(--muted)}.cart{position:sticky;top:20px}.cart-items{min-height:250px;max-height:370px;overflow:auto}.cartline{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}.qty{display:flex;gap:5px;align-items:center}.qty button{width:25px;height:25px;border:1px solid var(--border);background:var(--surface2);border-radius:6px;color:var(--text)}.summary{border-top:1px solid var(--border);margin-top:10px;padding-top:12px;display:grid;gap:8px}.sumrow{display:flex;justify-content:space-between;font-size:12px}.total{font-weight:400;font-size:24px}.empty{padding:35px;text-align:center;color:var(--muted)}.importbox{border:2px dashed var(--border);padding:28px;text-align:center;border-radius:12px}.notice{font-weight:400;padding:11px 13px;background:var(--surface2);border-radius:9px;color:var(--muted);font-size:12px;margin-bottom:14px}.hidden{display:none!important}@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.grid2,.pos{grid-template-columns:1fr}.sidebar{width:70px}.brand span,.nav button span{display:none}.main{margin-left:70px;width:calc(100% - 70px)}.products{grid-template-columns:repeat(2,1fr)}}

/* Final requested size adjustments — do not alter other design properties */
.app-logo, .appLogo, .logo {
  transform: scale(1.12);
  transform-origin: left center;
}
.tab-icon, .tab .icon, .tabs .icon, .tab svg, .tabs svg {
  width: 1.18em;
  height: 1.18em;
}
button, .button, .btn {
  padding: 0.82em 0.90em;
  font-size: 12px;
}

</style>

<style id="tab-icon-size-fix">
/* Requested: make navigation/tab icons larger only */
.nav button b{font-size:22px;line-height:1;flex:0 0 22px;text-align:center;}

/* Final logo balance + mobile centering fix */
@media(min-width:951px){
  .brand{gap:9px;padding-left:8px;padding-right:8px}
  .brand .logo{width:31px;height:31px}
  .brand span{font-size:16px}
}
@media(max-width:950px){
  .brand{justify-content:center;padding-left:0;padding-right:0}
  .brand .logo{width:31px;height:31px}
  .brand span{display:none}
}
<style id="low-stock-text-size">.low-stock-name{font-size:12px;font-weight:400}</style>
</head>

<main class="main"><div class="topbar"><div class="title"><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Offline supermarket management</p></div><div class="user"><span>Cashier</span><div class="avatar">C</div></div></div><div id="view"></div></main>
</div>
<script>
const state={page:'Dashboard',products:[
{id:1,sku:'P001',barcode:'479100000001',name:'Milk Powder 400g',category:'Dairy',cost:850,price:980,stock:24,min:10},
{id:2,sku:'P002',barcode:'479100000002',name:'Sugar 1kg',category:'Grocery',cost:220,price:260,stock:8,min:15},
{id:3,sku:'P003',barcode:'479100000003',name:'Tea 100g',category:'Beverages',cost:430,price:520,stock:18,min:8},
{id:4,sku:'P004',barcode:'479100000004',name:'Biscuits Pack',category:'Snacks',cost:120,price:160,stock:42,min:12},
{id:5,sku:'P005',barcode:'479100000005',name:'Rice 5kg',category:'Grocery',cost:1050,price:1180,stock:11,min:6},
{id:6,sku:'P006',barcode:'479100000006',name:'Coca Cola 1L',category:'Beverages',cost:270,price:340,stock:4,min:10}
],cart:[],sales:[],search:''};
const navItems=[['Dashboard','▦'],['POS','▣'],['Products','◈'],['Inventory','◫'],['Purchases','↥'],['Sales','≡'],['Customers','♙'],['Suppliers','♧'],['Expenses','◒'],['Reports','◔'],['Excel','⇅'],['Settings','⚙']];
function money(n){return 'Rs. '+Number(n).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2})}
function renderNav(){document.getElementById('nav').innerHTML=navItems.map(([n,i])=>`<button class="${state.page===n?'active':''}" onclick="go('${n}')"><b>${i}</b><span>${n}</span></button>`).join('')}
function go(p){state.page=p;renderNav();document.getElementById('pageTitle').textContent=p;document.getElementById('pageSub').textContent=p==='POS'?'Fast checkout and billing':'Offline supermarket management';render()}
function render(){const v=document.getElementById('view');({Dashboard:dashboard,POS:pos,Products:products,Inventory:inventory,Purchases:purchases,Sales:sales,Customers:customers,Suppliers:suppliers,Expenses:expenses,Reports:reports,Excel:excel,Settings:settings}[state.page]||dashboard)(v)}
function dashboard(v){const low=state.products.filter(p=>p.stock<=p.min);v.innerHTML=`<div class="cards"><div class="card"><div class="label">Today's Sales</div><div class="value">${money(85400)}</div><div class="delta ok">↑ 8.4% vs yesterday</div></div><div class="card"><div class="label">Invoices</div><div class="value">132</div><div class="delta ok">Today's completed bills</div></div><div class="card"><div class="label">Gross Profit</div><div class="value">${money(14200)}</div><div class="delta ok">16.6% margin</div></div><div class="card"><div class="label">Low Stock</div><div class="value">${low.length}</div><div class="delta warn">Needs attention</div></div></div><div class="grid2"><div class="panel"><h3>Sales — Last 7 Days</h3><div class="bars">${[52,68,45,78,61,92,72].map((x,i)=>`<div class="barwrap"><div class="bar" style="height:${x}%"></div><span>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</span></div>`).join('')}</div></div><div class="panel"><h3>Low Stock Alerts</h3><div class="list">${low.map(p=>`<div class="row"><div><b class="low-stock-name">${p.name}</b><br><small>${p.sku}</small></div><span class="badge warn">${p.stock} left</span></div>`).join('')||'<div class="empty">All stock levels are healthy.</div>'}</div></div></div>`}
function pos(v){const filtered=state.products.filter(p=>(p.name+p.barcode+p.sku).toLowerCase().includes(state.search.toLowerCase()));v.innerHTML=`<div class="pos"><div class="panel"><div class="search"><input class="input" id="posSearch" placeholder="Scan barcode or search product..." value="${state.search}" oninput="state.search=this.value;render()"><button class="btn primary" onclick="focusScan()">SCAN</button></div><div class="products">${filtered.map(p=>`<button class="product" onclick="addCart(${p.id})"><strong>${p.name}</strong><span>${p.barcode} · ${money(p.price)} · Stock ${p.stock}</span></button>`).join('')}</div></div><div class="panel cart"><h3>Current Bill</h3><div class="cart-items">${state.cart.length?state.cart.map((c,i)=>`<div class="cartline"><div><b>${c.name}</b><br><small>${money(c.price)} × ${c.qty}</small></div><div class="qty"><button onclick="changeQty(${i},-1)">−</button><b>${c.qty}</b><button onclick="changeQty(${i},1)">+</button></div></div>`).join(''):'<div class="empty">Scan or select products</div>'}</div><div class="summary"><div class="sumrow"><span>Subtotal</span><b>${money(cartTotal())}</b></div><div class="sumrow"><span>Discount</span><b>Rs. 0.00</b></div><div class="sumrow total"><span>Total</span><span>${money(cartTotal())}</span></div><button class="btn primary" onclick="checkout()">CASH PAYMENT</button><button class="btn" onclick="checkout()">CARD PAYMENT</button><button class="btn" onclick="clearCart()">Clear Bill</button></div></div></div>`}
function focusScan(){document.getElementById('posSearch')?.focus()}
function addCart(id){const p=state.products.find(x=>x.id===id), c=state.cart.find(x=>x.id===id);if(!p||p.stock<=0)return alert('Out of stock');if(c){if(c.qty<p.stock)c.qty++}else state.cart.push({...p,qty:1});render()}
function changeQty(i,d){const c=state.cart[i];const p=state.products.find(x=>x.id===c.id);c.qty+=d;if(c.qty>p.stock)c.qty=p.stock;if(c.qty<=0)state.cart.splice(i,1);render()}
function cartTotal(){return state.cart.reduce((s,c)=>s+c.price*c.qty,0)}
function clearCart(){state.cart=[];render()}
function checkout(){if(!state.cart.length)return alert('Cart is empty');const total=cartTotal();state.cart.forEach(c=>{const p=state.products.find(x=>x.id===c.id);p.stock-=c.qty});state.sales.unshift({invoice:'INV-'+String(Date.now()).slice(-6),total,date:new Date().toLocaleString()});alert('Sale completed — '+money(total));state.cart=[];state.page='POS';renderNav();render()}
function products(v){v.innerHTML=`<div class="panel"><div class="toolbar"><input class="input" placeholder="Search products..." oninput="filterTable(this.value)"><button class="btn primary" onclick="addProduct()">+ Add Product</button><button class="btn" onclick="go('Excel')">Import Excel</button></div><table class="table"><thead><tr><th>SKU</th><th>Barcode</th><th>Product</th><th>Category</th><th>Cost</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead><tbody id="productRows">${productRows()}</tbody></table></div>`}
function productRows(list=state.products){return list.map(p=>`<tr><td>${p.sku}</td><td>${p.barcode}</td><td><b>${p.name}</b></td><td>${p.category}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td><span class="badge ${p.stock<=p.min?'warn':'ok'}">${p.stock<=p.min?'LOW':'OK'}</span></td></tr>`).join('')}
function filterTable(q){document.getElementById('productRows').innerHTML=productRows(state.products.filter(p=>(p.name+p.sku+p.barcode+p.category).toLowerCase().includes(q.toLowerCase())))}
function addProduct(){alert('Product editor: SKU, barcode, name, category, unit, cost, selling price, minimum stock and expiry tracking. In the full build this opens as a modal and persists to the local database.')}
function inventory(v){v.innerHTML=`<div class="cards"><div class="card"><div class="label">Products</div><div class="value">${state.products.length}</div></div><div class="card"><div class="label">Total Units</div><div class="value">${state.products.reduce((a,p)=>a+p.stock,0)}</div></div><div class="card"><div class="label">Stock Value</div><div class="value">${money(state.products.reduce((a,p)=>a+p.stock*p.cost,0))}</div></div><div class="card"><div class="label">Out of Stock</div><div class="value">${state.products.filter(p=>p.stock===0).length}</div></div></div><div class="panel"><h3>Current Stock</h3><table class="table"><thead><tr><th>SKU</th><th>Product</th><th>Stock</th><th>Min</th><th>Status</th></tr></thead><tbody>${state.products.map(p=>`<tr><td>${p.sku}</td><td>${p.name}</td><td><b>${p.stock}</b></td><td>${p.min}</td><td><span class="badge ${p.stock===0?'danger':p.stock<=p.min?'warn':'ok'}">${p.stock===0?'OUT':p.stock<=p.min?'LOW':'OK'}</span></td></tr>`).join('')}</tbody></table></div>`}
function purchases(v){v.innerHTML=`<div class="panel"><div class="toolbar"><button class="btn primary" onclick="alert('New Purchase: supplier → invoice → products → quantities → cost → receive stock')">+ New Purchase</button><input class="input" placeholder="Search purchases..."></div><div class="notice">Receiving a purchase creates a stock-in movement. Purchase cost is retained for profit calculations.</div><table class="table"><thead><tr><th>Date</th><th>Invoice</th><th>Supplier</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody><tr><td>06 Oct 2026</td><td>PO-1024</td><td>ABC Distributors</td><td>24</td><td>${money(68400)}</td><td><span class="badge ok">Received</span></td></tr><tr><td>05 Oct 2026</td><td>PO-1023</td><td>City Wholesale</td><td>18</td><td>${money(32150)}</td><td><span class="badge ok">Received</span></td></tr></tbody></table></div>`}
function sales(v){v.innerHTML=`<div class="panel"><div class="toolbar"><input class="input" placeholder="Search invoice or cashier"><button class="btn">Export Excel</button></div><table class="table"><thead><tr><th>Invoice</th><th>Date</th><th>Cashier</th><th>Items</th><th>Total</th><th>Payment</th></tr></thead><tbody>${state.sales.concat([{invoice:'INV-482193',date:'06/10/2026 21:32',total:2450},{invoice:'INV-482192',date:'06/10/2026 21:28',total:1890}]).slice(0,10).map(s=>`<tr><td><b>${s.invoice}</b></td><td>${s.date}</td><td>Cashier</td><td>3</td><td>${money(s.total)}</td><td><span class="badge ok">Cash</span></td></tr>`).join('')}</tbody></table></div>`}
function customers(v){v.innerHTML=`<div class="panel"><div class="toolbar"><button class="btn primary">+ Add Customer</button><input class="input" placeholder="Search name or phone..."></div><table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Total Purchases</th><th>Outstanding</th><th>Status</th></tr></thead><tbody><tr><td>Walk-in Customer</td><td>—</td><td>—</td><td>—</td><td><span class="badge ok">Active</span></td></tr><tr><td>ABC Bakery</td><td>077 123 4567</td><td>${money(24500)}</td><td>${money(4200)}</td><td><span class="badge warn">Credit</span></td></tr></tbody></table></div>`}
function suppliers(v){v.innerHTML=`<div class="panel"><div class="toolbar"><button class="btn primary">+ Add Supplier</button><input class="input" placeholder="Search supplier..."></div><table class="table"><thead><tr><th>Supplier</th><th>Phone</th><th>Purchases</th><th>Outstanding</th></tr></thead><tbody><tr><td>ABC Distributors</td><td>071 555 1234</td><td>${money(184000)}</td><td>${money(32000)}</td></tr><tr><td>City Wholesale</td><td>077 888 2211</td><td>${money(92000)}</td><td>${money(0)}</td></tr></tbody></table></div>`}
function expenses(v){v.innerHTML=`<div class="panel"><div class="toolbar"><button class="btn primary">+ Add Expense</button><input class="input" placeholder="Search expenses..."></div><table class="table"><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Payment</th></tr></thead><tbody><tr><td>06 Oct</td><td>Electricity</td><td>Monthly bill</td><td>${money(18500)}</td><td>Cash</td></tr><tr><td>05 Oct</td><td>Transport</td><td>Delivery</td><td>${money(3200)}</td><td>Cash</td></tr></tbody></table></div>`}
function reports(v){v.innerHTML=`<div class="cards"><div class="card"><div class="label">Gross Sales</div><div class="value">${money(85400)}</div></div><div class="card"><div class="label">COGS</div><div class="value">${money(71200)}</div></div><div class="card"><div class="label">Gross Profit</div><div class="value">${money(14200)}</div></div><div class="card"><div class="label">Expenses</div><div class="value">${money(21700)}</div></div></div><div class="grid2"><div class="panel"><h3>Report Center</h3><div class="list">${['Daily Sales Report','Product Sales Report','Stock Valuation','Stock Movement','Purchase Report','Gross Profit Report','Cashier / Shift Report','Customer Credit Report'].map(x=>`<div class="row"><b>${x}</b><button class="btn">View / Export</button></div>`).join('')}</div></div><div class="panel"><h3>Profit Snapshot</h3><div class="notice">Gross profit is calculated using the cost price stored at the time of each sale.</div><div class="sumrow total"><span>Net after expenses</span><span>${money(14200-21700)}</span></div></div></div>`}
function excel(v){v.innerHTML=`<div class="grid2"><div class="panel"><h3>Export Data</h3><div class="list">${['Products','Current Stock','Sales','Purchases','Customers','Suppliers','Stock Movements','Profit Report'].map(x=>`<div class="row"><span>${x}</span><button class="btn" onclick="alert('${x} Excel export prepared')">Export XLSX</button></div>`).join('')}</div></div><div class="panel"><h3>Import Excel</h3><div class="importbox"><b>Drop XLSX here</b><p style="color:var(--muted);font-size:12px">or choose Products / Price Updates / Stock Adjustments workbook</p><input type="file" accept=".xlsx,.xls" onchange="excelChosen(this)"></div><div id="importStatus"></div></div></div><div class="panel" style="margin-top:16px"><h3>Import Rules</h3><div class="notice">Uploads are validated before any database change. Unknown SKU, duplicate barcode, invalid quantities and missing required fields become errors. Valid changes are shown in a preview before confirmation.</div><table class="table"><thead><tr><th>Workbook</th><th>Purpose</th><th>Mode</th></tr></thead><tbody><tr><td>Products</td><td>Bulk product creation/update</td><td>Upsert</td></tr><tr><td>Price_Updates</td><td>Change cost/selling prices</td><td>History tracked</td></tr><tr><td>Stock_Adjustments</td><td>Damage/count corrections</td><td>Movement logged</td></tr></tbody></table></div>`}
function excelChosen(input){if(!input.files.length)return;document.getElementById('importStatus').innerHTML='<div class="notice" style="margin-top:14px"><b>Validation preview ready.</b><br>In the full local build the workbook is parsed, validated, differences are displayed, and only after confirmation are changes committed.</div>'}
function settings(v){v.innerHTML=`<div class="grid2"><div class="panel"><h3>Store Settings</h3><div class="list"><div class="row"><span>Store Name</span><input class="input" value="My Supermarket"></div><div class="row"><span>Currency</span><input class="input" value="LKR" disabled></div><div class="row"><span>Tax</span><input class="input" value="0%"></div><div class="row"><span>Receipt Footer</span><input class="input" value="Thank you! Come again."></div></div></div><div class="panel"><h3>Data & Backup</h3><div class="notice">The local database should be backed up regularly to another drive. The backup contains products, sales, stock movements and settings.</div><button class="btn primary" onclick="alert('Local database backup prepared')">Backup Database</button> <button class="btn">Restore</button></div></div>`}
renderNav();render();
</script>
</body>
</html>
